
name: PR Pipeline

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

jobs:
  build-test:
    name: Build & Test
    uses: ./.github/workflows/reusable-build-test.yml

    with:
      node_version: '22'
      run_tests: true

  pr-comment:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Print PR Summary
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          TEST_RESULT: ${{ needs.build-test.outputs.test_result }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          echo "PR checks passed for branch: ${BRANCH_NAME}"
          echo "Test result: ${TEST_RESULT}"
          echo "Commit: ${COMMIT_SHA}"
