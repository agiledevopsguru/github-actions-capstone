
name: Reusable Docker Build and Push

on:
  workflow_call:
    inputs:
      image_name:
        description: Docker Hub image name
        required: true
        type: string

      tag:
        description: Docker image tag
        required: true
        type: string

    secrets:
      docker_username:
        required: true

      docker_token:
        required: true

    outputs:
      image_url:
        description: Published Docker image URL
        value: ${{ jobs.docker.outputs.image_url }}

permissions:
  contents: read
  security-events: write

jobs:
  docker:
    runs-on: ubuntu-latest

    outputs:
      image_url: ${{ steps.image.outputs.image_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # uses: actions/checkout@v4

      - name: Generate Short SHA
        id: short-sha
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set image details
        id: image
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          TAG: ${{ inputs.tag }}
        run: |
          echo "image_url=docker.io/${IMAGE_NAME}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build Docker Image
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          TAG: ${{ inputs.tag }}
          SHORT_SHA: ${{ steps.short-sha.outputs.sha }}
        run: |
          docker build \
            -t "${IMAGE_NAME}:${TAG}" \
            -t "${IMAGE_NAME}:sha-${SHORT_SHA}" \
            .

      - name: Scan Docker Image for Vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: ${{ inputs.image_name }}:${{ inputs.tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload Trivy Scan Results to GitHub Security
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          sarif_file: trivy-results.sarif

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        # uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker_username }}
          password: ${{ secrets.docker_token }}

      - name: Push Docker Image
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          TAG: ${{ inputs.tag }}
          SHORT_SHA: ${{ steps.short-sha.outputs.sha }}
        run: |
          docker push "${IMAGE_NAME}:${TAG}"
          docker push "${IMAGE_NAME}:sha-${SHORT_SHA}"
