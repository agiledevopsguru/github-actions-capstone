
name: Reusable Docker Build and Push

on:
  workflow_call:
    inputs:
      image_name:
        description: Docker Hub image name
        required: true
        type: string

      tag:
        description: Docker image tag
        required: true
        type: string

      docker_username:
        description: Docker Hub username
        required: true
        type: string

    secrets:
      docker_token:
        required: true

    outputs:
      image_url:
        description: Published Docker image URL
        value: ${{ jobs.docker.outputs.image_url }}

jobs:
  docker:
    runs-on: ubuntu-latest

    outputs:
      image_url: ${{ steps.image.outputs.image_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ inputs.docker_username }}
          password: ${{ secrets.docker_token }}

      - name: Prepare image details
        id: image
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          TAG: ${{ inputs.tag }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          echo "image_url=${IMAGE_NAME}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "Image: ${IMAGE_NAME}"
          echo "Tags: ${TAG}, sha-${SHORT_SHA:0:7}"

      - name: Build Docker Image
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          TAG: ${{ inputs.tag }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          docker build \
            -t "${IMAGE_NAME}:${TAG}" \
            -t "${IMAGE_NAME}:sha-${SHORT_SHA:0:7}" .

      - name: Push Docker Images
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          TAG: ${{ inputs.tag }}
          SHORT_SHA: ${{ github.sha }}
        run: |
          docker push "${IMAGE_NAME}:${TAG}"
          docker push "${IMAGE_NAME}:sha-${SHORT_SHA:0:7}"

