
name: Reusable — Docker Build & Push

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Full Docker Hub image name'
        type: string
        required: true

      tag:
        description: 'Docker image tag'
        type: string
        required: true

      docker_username:
        description: 'Docker Hub username'
        type: string
        required: true

    secrets:
      docker_token:
        description: 'Docker Hub access token'
        required: true

    outputs:
      image_url:
        description: 'Published Docker image URL'
        value: ${{ jobs.docker-build-push.outputs.image_url }}

jobs:
  docker-build-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest

    outputs:
      image_url: ${{ steps.set-image-url.outputs.image_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ inputs.docker_username }}
          password: ${{ secrets.docker_token }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ inputs.image_name }}:${{ inputs.tag }}
            ${{ inputs.image_name }}:sha-${{ github.sha }}

      - name: Set image URL output
        id: set-image-url
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          echo "image_url=${IMAGE_NAME}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ inputs.image_name }}:${{ inputs.tag }}
          format: table
          output: trivy-report.txt
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy Scan Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-report
          path: trivy-report.txt
          if-no-files-found: ignore
